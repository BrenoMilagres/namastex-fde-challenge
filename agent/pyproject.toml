[project]
name = "autoseguro-agent"
version = "0.1.0"
description = "Agente de vendas de seguro auto (desafio FDE Namastex)"
requires-python = ">=3.10"
dependencies = [
    "langchain-google-genai>=2.0",   # modelo (Gemini) via LangChain
    "langgraph>=0.2.60",
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary,pool]>=3.2",
    "fastembed>=0.4",                # embedding local (few-shot em runtime)
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "pydantic>=2.6",
]

# Extra so pra CONSTRUIR o indice (le o parquet). O runtime nao precisa de pandas.
#   uv sync --extra index
[project.optional-dependencies]
index = [
    "pandas>=2.0",
    "pyarrow>=15",
]

[tool.uv]
package = false
